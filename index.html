
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Andrew Chamroeun">
    <title>Bear Hunter Ninja</title>
</head>
<body>

    <h1>Bear Hunter Ninja</h1>

    <p id="gameResult"></p>

    <script>
        // Ask the player for their name.
        let playerName = prompt("Welcome to Bear Hunter Ninja! Enter your name to get started.");

        // Greet the player using their name.
        alert("Hi " + playerName + " Let's Play!!");

        // Ask the player to choose Bear, Ninja, or Hunter.
        let playerChoice = prompt("Who are you: Bear, Ninja, or Hunter?");

        // Keep the computer's choice hard-coded to Bear.
        let computerChoice = "Bear";

        // Create a variable to store the result of the game.
        let gameResult;

        // Use a switch statement to evaluate the player's choice.
        switch (playerChoice) {
            case "Bear":
                // Both choices are Bear, so the game is a tie.
                if (computerChoice === "Bear") {
                    gameResult = "Tie!!";
                } else if (computerChoice === "Ninja") {
                    gameResult = "You Win!!";
                } else {
                    gameResult = "You Lose!!";
                }
                break;

            case "Ninja":
                // Ninja beats Hunter but loses to Bear.
                if (computerChoice === "Bear") {
                    gameResult = "You Lose!!";
                } else if (computerChoice === "Ninja") {
                    gameResult = "Tie!!";
                } else {
                    gameResult = "You Win!!";
                }
                break;

            case "Hunter":
                // Hunter beats Bear but loses to Ninja.
                if (computerChoice === "Bear") {
                    gameResult = "You Win!!";
                } else if (computerChoice === "Ninja") {
                    gameResult = "You Lose!!";
                } else {
                    gameResult = "Tie!!";
                }
                break;
        }

        // Combine the player's choice, computer's choice, and outcome.
        let finalMessage = playerName + " chose " + playerChoice
            + ", computer chose " + computerChoice
            + ", " + gameResult;

        // Display the result on the HTML page.
        document.getElementById("gameResult").textContent = finalMessage;

        // Display the same result in the browser console.
        console.log(finalMessage);

    </script>

</body>
</html>
